name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=3 ./...
        env:
          CGO_ENABLED: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          # staticcheck needs a newer Go than the oldest one resumux supports.
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fuzz frame decoder
        run: go test -run '^$' -fuzz FuzzDecodeFrame -fuzztime 60s ./session/
      - name: Fuzz session input
        run: go test -run '^$' -fuzz FuzzSessionInput -fuzztime 60s ./session/
